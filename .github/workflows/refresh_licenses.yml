name: Refresh SPDX license list

# Monthly check that src/enums/license.json still matches the live SPDX
# license-list-data feed. Opens a PR with the refreshed file when it drifts.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check for drift against live SPDX data
        id: check
        run: |
          if fetch-spdx --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh src/enums/license.json
        if: steps.check.outputs.drift == 'true'
        run: fetch-spdx

      - name: Rebuild derived artifacts (XSD / JSON Schema / biotools_vocab.py)
        if: steps.check.outputs.drift == 'true'
        run: build-schema

      - name: Run tests against refreshed license list
        if: steps.check.outputs.drift == 'true'
        run: |
          mkdir -p examples
          for f in biotools.xml biotools_mandatoryFieldsOnly.xml; do
            gh api repos/bio-tools/biotoolsSchema/contents/examples/$f --jq '.content' \
              | base64 -d > examples/$f
          done
          pytest -q tests
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open pull request
        if: steps.check.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh SPDX license list"
          title: "chore: refresh SPDX license list"
          body: |
            Automated update of `src/enums/license.json` from the live
            [SPDX license-list-data](https://github.com/spdx/license-list-data) feed.

            Generated by the `refresh_licenses` workflow - review the diff for
            newly added or newly deprecated licenses before merging.
          branch: chore/refresh-spdx-licenses
          delete-branch: true
