name: Refresh SPDX licenses

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-spdx

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: fetch-spdx
      - run: python -B -m unittest discover -s tests
      - run: build-schema
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            src/enums/license.json
            jsonschema/biotoolsj.json
          branch: chore/refresh-spdx-licenses
          commit-message: "chore: refresh SPDX license list"
          title: Refresh SPDX license list
          body: Review the updated SPDX snapshot, accepted IDs, and newly deprecated licenses.
          delete-branch: true
